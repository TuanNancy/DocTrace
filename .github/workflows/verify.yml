name: Verify and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - name: Verify rate limit windows and concurrency against real Redis
        run: python scripts/verify_rate_limits.py
      - name: Verify Redis library transactions and real Linux RQ workers
        run: python scripts/verify_document_queue.py

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      # Build-only placeholders. Tests mock external Auth/API calls.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Build and test frontend with local Auth/API fixtures
        run: npm run test:e2e
      - name: Verify build with deployment environment
        run: npm run build
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: frontend-browser-failures
          path: frontend/test-results/
          retention-days: 7

  deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BACKEND_ENV_FILE: ./deploy/tests/api.env
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate production Compose
        run: docker compose --env-file .env.production.example -f compose.production.yml config --quiet
      - name: Verify deployment and rollback orchestration
        run: python -m unittest discover -s deploy/tests -p test_deploy.py -v
      - name: Build API image
        run: docker build -t doctrace-api:verify ./backend
      - name: Verify certificate orchestration
        run: docker run --rm -v "$PWD/deploy:/workspace/deploy:ro" doctrace-api:verify python -m unittest discover -s /workspace/deploy/tests -p test_certificates.py -v
      - name: Verify Nginx bootstrap, TLS, forwarding and SSE
        run: python deploy/tests/verify_nginx.py --api-image doctrace-api:verify

  deploy:
    needs: [backend, frontend, deployment]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    # Includes image build and up to 16m waiting for an active RQ job to finish.
    timeout-minutes: 45
    concurrency:
      group: doctrace-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - name: Deploy verified commit over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Set the VPS_HOST repository secret}"
          : "${VPS_USER:?Set the VPS_USER repository secret}"
          : "${VPS_SSH_KEY:?Set the VPS_SSH_KEY repository secret}"
          : "${VPS_KNOWN_HOSTS:?Set the VPS_KNOWN_HOSTS repository secret}"
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          chmod 700 "$ssh_dir"
          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          ssh -T -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$VPS_USER@$VPS_HOST" "
              set -eu
              script=\$(mktemp)
              trap 'rm -f \"\$script\"' EXIT
              cat > \"\$script\"
              bash \"\$script\" deploy '$GITHUB_SHA'
            " < deploy/deploy.sh
