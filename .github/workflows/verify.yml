name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Syntactically valid test values; tests mock services and build makes no auth calls.
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: test-publishable-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results/
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    env:
      BACKEND_ENV_FILE: ./backend/.env.example
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.production.example -f compose.production.yml config --no-env-resolution --quiet
      - run: docker build -t doctrace-api:ci ./backend
      - name: API container liveness
        run: |
          docker run -d --name doctrace-api -p 127.0.0.1:8000:8000 doctrace-api:ci
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs doctrace-api
          exit 1
      - name: Validate Caddy
        run: docker run --rm -e API_DOMAIN=api.example.com -e ACME_EMAIL=ci@example.com -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile
      - if: always()
        run: docker rm -f doctrace-api || true
