# Included once at http level by either entrypoint template.
# Nginx error logs include raw request lines and cannot use log_format. Request
# failures are observable through status/upstream_status below; startup/config
# diagnostics still use the main-context error log.
error_log /dev/null;

map $http_x_request_id $doctrace_request_id {
    default $request_id;
    "~^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$" $http_x_request_id;
}

map $request_method $doctrace_method {
    default OTHER;
    GET GET;
    HEAD HEAD;
    POST POST;
    PUT PUT;
    PATCH PATCH;
    DELETE DELETE;
    OPTIONS OPTIONS;
}

# Emit code-owned route labels, never arbitrary URLs, IDs or query strings.
map $uri $doctrace_route {
    default "<unmatched>";
    /health /health;
    /ready /ready;
    /api/upload /api/upload;
    /api/chat /api/chat;
    /api/usage /api/usage;
    /api/documents /api/documents;
    /api/conversations /api/conversations;
    /api/workspaces /api/workspaces;
    ~^/api/documents/[^/]+$ "/api/documents/{id}";
    ~^/api/documents/[^/]+/retry$ "/api/documents/{id}/retry";
    ~^/api/documents/[^/]+/file$ "/api/documents/{id}/file";
    ~^/api/documents/[^/]+/chunks/[^/]+$ "/api/documents/{id}/chunks/{id}";
    ~^/api/conversations/[^/]+$ "/api/conversations/{id}";
    ~^/api/workspaces/ "/api/workspaces/{path}";
    ~^/\.well-known/acme-challenge/ /acme-challenge;
}

log_format doctrace_safe escape=json
    '{"timestamp":"$time_iso8601","event":"proxy_request",'
    '"request_id":"$doctrace_request_id","method":"$doctrace_method",'
    '"route":"$doctrace_route","status":$status,"duration_seconds":$request_time,'
    '"upstream_status":"$upstream_status"}';
