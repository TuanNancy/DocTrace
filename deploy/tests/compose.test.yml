# Only used by verify_nginx.py with a random project name and isolated volumes.
services:
  api:
    command: ["python", "/checks/upstream.py"]
    environment:
      PYTHONPATH: /app
    volumes:
      - ./deploy/tests:/checks:ro
    healthcheck:
      interval: 1s
      start_period: 1s
  nginx:
    healthcheck:
      interval: 1s
      start_period: 1s
  certbot:
    volumes:
      - ./deploy/tests:/checks:ro
